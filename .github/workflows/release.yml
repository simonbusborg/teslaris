name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Signing/notarization runs only when the secrets are configured; without
# them the release falls back to the old ad-hoc-signed build.
env:
  HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Signing is all or nothing. With no signing secrets at all the
      # release is the ad-hoc build described above (Teslaris ships that
      # way today, so the preflight must not block it). With some but not
      # all of them, the app gets signed and the run only fails at
      # notarization minutes later. The set is checked before anything is
      # built, so a missing one costs a red run at second ten.
      - name: Preflight — signing secrets are complete or absent
        env:
          HAS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD != '' }}
          HAS_NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID != '' }}
          HAS_NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID != '' }}
          HAS_NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD != '' }}
        run: |
          present=""; missing=""
          for name in HAS_SIGNING HAS_CERT_PASSWORD HAS_NOTARY_APPLE_ID HAS_NOTARY_TEAM_ID HAS_NOTARY_APP_PASSWORD; do
            eval "value=\$$name"
            if [ "$value" = "true" ]; then present="$present $name"; else missing="$missing $name"; fi
          done
          if [ -n "$present" ] && [ -n "$missing" ]; then
            echo "Refusing to release: signing is half configured, missing secrets for$missing"
            echo "Add them under Settings → Secrets → Actions, then re-run this tag."
            exit 1
          fi
          test -n "$present" || echo "No signing secrets: releasing an ad-hoc-signed build"

      # The update checker compares Info.plist's version against the
      # latest release tag — a mismatch would nag every user forever.
      - name: Verify tag matches Info.plist version
        run: |
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          TAG="${GITHUB_REF_NAME#v}"
          test "$PLIST" = "$TAG" || { echo "Info.plist has $PLIST but tag is $TAG"; exit 1; }

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 1800 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build Teslaris.app
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            make app IDENTITY="$IDENTITY"
          else
            make app
          fi

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent Teslaris.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple Teslaris.app

      - name: Package (dmg + zip)
        run: |
          make dmg
          ditto -c -k --keepParent Teslaris.app Teslaris.zip

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Teslaris.dmg
            Teslaris.zip
          generate_release_notes: true

      # Reads back what the world can actually see. The upload step can
      # succeed while an asset is missing from the release — a name typo, a
      # race with a re-run — and only this step would notice.
      - name: Verify the published release is complete
        if: github.repository == 'simonbusborg/teslaris'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | sort > assets.txt
          grep -qx Teslaris.dmg assets.txt || { echo "release is missing Teslaris.dmg"; exit 1; }
          grep -qx Teslaris.zip assets.txt || { echo "release is missing Teslaris.zip"; exit 1; }
          # The shipped zip is what users unpack; make sure it is the
          # universal, stapled build and not a stale local artefact.
          ditto -x -k Teslaris.zip verify
          lipo verify/Teslaris.app/Contents/MacOS/Teslaris -verify_arch arm64 x86_64 \
            || { echo "Teslaris.app is not a universal binary"; exit 1; }
          if [ "$HAS_SIGNING" = "true" ]; then
            xcrun stapler validate verify/Teslaris.app \
              || { echo "Teslaris.app carries no notarization ticket"; exit 1; }
          fi
          echo "release $GITHUB_REF_NAME is complete: dmg and zip published, universal"
